schema_version: "1.0"
workflow:
  id: "speckit-session-hopper"
  name: "SDD cycle with per-step session isolation"
  version: "0.1.0"
  author: "haexmas"
  description: "Same steps as bundled speckit, but prompts the operator to run each command step in a fresh agent session."

requires:
  speckit_version: ">=0.7.2"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"

steps:
  - id: specify
    command: speckit.specify
    hooks:
      before:
        - script: .specify/extensions/workflow-atoms/com.github.haexmas.atoms.speckit-session-hopper/before-step.sh
          args: ["specify"]
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    hooks:
      before:
        - script: .specify/extensions/workflow-atoms/com.github.haexmas.atoms.speckit-session-hopper/before-step.sh
          args: ["clarify"]

  - id: plan
    command: speckit.plan
    hooks:
      before:
        - script: .specify/extensions/workflow-atoms/com.github.haexmas.atoms.speckit-session-hopper/before-step.sh
          args: ["plan"]

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    hooks:
      before:
        - script: .specify/extensions/workflow-atoms/com.github.haexmas.atoms.speckit-session-hopper/before-step.sh
          args: ["tasks"]

  - id: analyze
    command: speckit.analyze
    hooks:
      before:
        - script: .specify/extensions/workflow-atoms/com.github.haexmas.atoms.speckit-session-hopper/before-step.sh
          args: ["analyze"]

  - id: implement
    command: speckit.implement
    hooks:
      before:
        - script: .specify/extensions/workflow-atoms/com.github.haexmas.atoms.speckit-session-hopper/before-step.sh
          args: ["implement"]
